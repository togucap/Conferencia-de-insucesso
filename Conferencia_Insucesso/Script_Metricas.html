<script>
  // ============================================================================
  // SCRIPT: MÉTRICAS, RESUMOS E DASHBOARDS (COM LEITURA SINCRONIZADA FLASH E VEREDITO)
  // ============================================================================

  // --- NOVA FUNÇÃO DE LEITURA (MUITO MAIS RÁPIDA) ---
  function obterSetRecebidosAba(callback, forceArray = null) {
      if (forceArray !== null) {
          callback(new Set(forceArray));
          return;
      }
      
      if (typeof mostrarLoader === 'function') mostrarLoader("A sincronizar com a Lista de Chegada...\nPor favor, aguarde.");
      if (statusMensagem) statusMensagem.innerText = "A carregar auditoria sistémica local da carga...";
      
      google.script.run
          .withSuccessHandler(function(recebidos) {
              if (typeof esconderLoader === 'function') esconderLoader();
              if (statusMensagem) statusMensagem.innerText = "";
              callback(new Set(recebidos));
          })
          .withFailureHandler(function(e) {
              if (typeof esconderLoader === 'function') esconderLoader();
              if (statusMensagem) statusMensagem.innerText = "";
              callback(new Set());
          })
          .getTagsRecebidasPorAba(cargaAtual);
  }

  // --- FUNÇÃO AUXILIAR PARA CRIAR A CHAVE COMPOSTA (PEDIDO|ETIQUETA) NO FRONTEND ---
  function getChaveSistemica(linhaObj) {
      const ped = linhaObj.dados[indicePedidoFaturado] ? String(linhaObj.dados[indicePedidoFaturado]).trim() : "";
      const merc = linhaObj.dados[indiceColunaMercadoria] ? String(linhaObj.dados[indiceColunaMercadoria]).trim() : "";
      return ped + "|" + merc;
  }

  // --- LÓGICA DO RESUMO FINAL (MODAL) ---
  // Os números vêm do motor de julgamento (Julgamento.gs), o mesmo usado pelo Excel e pelo romaneio.
  function mostrarResumoFinal(tagsSincronizadasSet = null) {
      const forcados = tagsSincronizadasSet ? Array.from(tagsSincronizadasSet) : null;
      obterJulgamentoAtual(function(j) {
          const porcentagem = totalItensCarga === 0 ? 0 : Math.round((itensConferidosCarga / totalItensCarga) * 100);
          if (resumoTaxaConclusao) resumoTaxaConclusao.innerText = porcentagem + '%';
          if (resumoItensAuditados) resumoItensAuditados.innerText = itensConferidosCarga + ' / ' + totalItensCarga;
          renderizarPainelJulgamento(document.getElementById('painelJulgamentoResumo'), j);
          if (modalResumoFinal) modalResumoFinal.style.display = 'flex';
      }, forcados);
  }

  // --- BOTÕES DE AÇÃO (FINALIZAÇÃO E NAVEGAÇÃO) ---
  if (btnFinalizarAuditoria) {
      btnFinalizarAuditoria.addEventListener('click', function() {
          if (!cargaAtual) return;
          if (modalConfirmacao) modalConfirmacao.style.display = 'flex';
      });
  }

  if (btnCancelarFinalizacao) {
      btnCancelarFinalizacao.addEventListener('click', function() {
          if (modalConfirmacao) modalConfirmacao.style.display = 'none';
      });
  }

  if (btnConfirmarFinalizacao) {
      btnConfirmarFinalizacao.addEventListener('click', function() {
          if (modalConfirmacao) modalConfirmacao.style.display = 'none';
          
          if (selectAbas) {
              selectAbas.dataset.finalizada = 'true';
              const label = document.getElementById('labelCargaSelecionada');
              if (label) {
                  label.innerHTML = `${selectAbas.value} <span style="color: var(--emerald); font-size: 12px; margin-left: 8px;">(Concluída)</span>`;
              }
          }
          
          if (typeof mostrarLoader === 'function') mostrarLoader("A finalizar auditoria e a consolidar cruzamentos de estoque.\nIsto pode demorar alguns segundos...");
          if (statusMensagem) statusMensagem.innerText = "A finalizar auditoria e a consolidar cruzamentos de estoque. Aguarde...";
          
          google.script.run
              .withSuccessHandler(function(recebidosArr) {
                  if (typeof esconderLoader === 'function') esconderLoader();
                  if (statusMensagem) statusMensagem.innerText = "";
                  mostrarResumoFinal(new Set(recebidosArr));
              })
              .withFailureHandler(function(erro) {
                  if (typeof esconderLoader === 'function') esconderLoader();
                  if (statusMensagem) statusMensagem.innerText = "Erro ao finalizar: " + erro.message;
                  mostrarResumoFinal(); 
              })
              .finalizarCargaStatus(cargaAtual);
      });
  }

  if (btnContinuarAuditoria) {
      btnContinuarAuditoria.addEventListener('click', function() {
          if (!cargaAtual) return;
          
          if (selectAbas) {
              selectAbas.dataset.finalizada = 'false';
              const label = document.getElementById('labelCargaSelecionada');
              if (label) {
                  label.innerHTML = `${selectAbas.value} <span style="color: var(--brand-accent); font-size: 12px; margin-left: 8px;">(Em Aberto)</span>`;
              }
          }
          
          // ====================================================================
          // RESTAURAÇÃO: Faz o botão "Finalizar" voltar a aparecer no cabeçalho
          // ====================================================================
          if (btnFinalizarAuditoria) btnFinalizarAuditoria.style.display = 'block';
          
          if (modalResumoFinal) modalResumoFinal.style.display = 'none';
          google.script.run.reabrirCargaStatus(cargaAtual);
      });
  }

  if (btnVoltarSelecao) {
      btnVoltarSelecao.addEventListener('click', function() {
          if (modalResumoFinal) modalResumoFinal.style.display = 'none';
          
          if (tabelaCabecalho) tabelaCabecalho.innerHTML = "";
          if (tabelaCorpo) tabelaCorpo.innerHTML = "";
          if (listaNaoEncontrados) listaNaoEncontrados.innerHTML = "";
          if (containerNaoEncontrados) containerNaoEncontrados.style.display = 'none';
          if (resultadoBipe) resultadoBipe.innerText = "";
          
          if (kpiContainer) kpiContainer.style.display = 'none';
          if (containerProgresso) containerProgresso.style.display = 'none';
          if (containerTabela) containerTabela.style.display = 'none';
          if (tableControls) tableControls.style.display = 'none';
          if (containerSwitchVisao) containerSwitchVisao.style.display = 'none';
          if (visaoBipar) visaoBipar.style.display = 'none';
          if (btnFinalizarAuditoria) btnFinalizarAuditoria.style.display = 'none';
          if (statusMensagem) statusMensagem.innerText = "";
          
          cargaAtual = "";
          
          if (selectAbas) {
              selectAbas.value = "";
              selectAbas.dataset.finalizada = "false";
              const label = document.getElementById('labelCargaSelecionada');
              if (label) label.innerHTML = "-- Selecionar Carga --";
          }
          
          if (btnCarregar) btnCarregar.disabled = true;
      });
  }

  // --- LÓGICA DO RELATÓRIO MICRO (botão "Detalhes") ---
  if (btnRelatorioMicro) {
      btnRelatorioMicro.addEventListener('click', function() {
        obterJulgamentoAtual(function(j) {
            renderizarPainelJulgamento(document.getElementById('painelJulgamentoMicro'), j);
            if (modalMicro) modalMicro.style.display = 'flex';
        });
      });
  }

  if (btnFecharModal) {
      btnFecharModal.addEventListener('click', function() {
        if (modalMicro) modalMicro.style.display = 'none';
      });
  }
</script>
