  // --- INICIALIZAÇÃO DO SISTEMA ---
  document.addEventListener("DOMContentLoaded", function() {
    if (statusMensagem) statusMensagem.innerText = "Conectando à base de dados do ecossistema...";
    
    // Carrega as abas normais
    google.script.run
      .withSuccessHandler(preencherSelectAbas)
      .withFailureHandler(mostrarErroDaInicializacao)

    // Carrega a inteligência JSON para varreduras em milissegundos
    google.script.run
      .withSuccessHandler(function(hist) { mapaHistoricoGlobal = hist || {}; })
      .obterHistoricoEventosFrontend();
  });

  function preencherSelectAbas(abas) {
    if (statusMensagem) statusMensagem.innerText = "";
    
    const containerContent = document.getElementById('conteudoDropdownCarga');
    if (!containerContent) return;
    
    let abertas = abas.filter(a => !(typeof a === 'string' ? false : a.finalizada));
    let concluidas = abas.filter(a => (typeof a === 'string' ? false : a.finalizada));
    
    let html = '';
    
    if (abertas.length > 0) {
        html += `
        <div class="carga-group-header">
            <div style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--brand-accent);"></div>
            Em Aberto / Processamento
        </div>`;
        abertas.forEach(a => {
            const nome = typeof a === 'string' ? a : a.nome;
            html += `
            <div class="carga-item aberta" data-value="${nome}" data-finalizada="false">
                <span class="carga-item-title">${nome}</span>
                <span class="carga-badge badge-aberta">Processando</span>
            </div>`;
        });
    }
    
    if (concluidas.length > 0) {
        html += `
        <div class="carga-group-header">
            <div style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--emerald);"></div>
            Cargas Finalizadas
        </div>`;
        concluidas.forEach(a => {
            const nome = typeof a === 'string' ? a : a.nome;
            html += `
            <div class="carga-item concluida" data-value="${nome}" data-finalizada="true">
                <span class="carga-item-title">${nome}</span>
                <span class="carga-badge badge-concluida">Concluída</span>
            </div>`;
        });
    }
    
    if (html === '') {
        html = '<div style="padding: 15px; color: var(--text-support); text-align: center;">Nenhuma carga encontrada na base de dados.</div>';
    }
    
    containerContent.innerHTML = html;
  }

  document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('dropdownSelecaoCarga');
      const btnSelect = document.getElementById('btnSelectAbas');
      const labelStr = document.getElementById('labelCargaSelecionada');
      const inputHidden = document.getElementById('selectAbas');
      const btnIniciarLocal = document.getElementById('btnCarregar');
      
      if (!dropdown) return;
      
      if (e.target.closest('#btnSelectAbas')) {
          dropdown.classList.toggle('active');
          const content = document.getElementById('conteudoDropdownCarga');
          content.style.display = dropdown.classList.contains('active') ? 'block' : 'none';
      } 
      else if (e.target.closest('.carga-item')) {
          const item = e.target.closest('.carga-item');
          const valor = item.getAttribute('data-value');
          const finalizada = item.getAttribute('data-finalizada') === 'true';
          
          inputHidden.value = valor;
          inputHidden.dataset.finalizada = finalizada; 
          
          if (finalizada) {
              labelStr.innerHTML = `${valor} <span style="color: var(--emerald); font-size: 12px; margin-left: 8px;">(Concluída)</span>`;
          } else {
              labelStr.innerHTML = `${valor} <span style="color: var(--brand-accent); font-size: 12px; margin-left: 8px;">(Em Aberto)</span>`;
          }
          
          dropdown.classList.remove('active');
          document.getElementById('conteudoDropdownCarga').style.display = 'none';
          if (btnIniciarLocal) btnIniciarLocal.disabled = false;
      }
      else if (!e.target.closest('#dropdownSelecaoCarga')) {
          dropdown.classList.remove('active');
          const content = document.getElementById('conteudoDropdownCarga');
          if (content) content.style.display = 'none';
      }
  });

  function mostrarErroDaInicializacao(erro) {
    if (statusMensagem) statusMensagem.innerText = "Falha de conexão com a infraestrutura: " + erro.message;
    if (btnCarregar) btnCarregar.disabled = false;
  }

  // --- SISTEMA DE CARREGAMENTO GLOBAL (SPINNER) ---
  const globalLoader = document.getElementById('globalLoader');
  const globalLoaderText = document.getElementById('globalLoaderText');

  window.mostrarLoader = function(mensagem) {
      if (globalLoaderText) globalLoaderText.innerText = mensagem || "A processar...";
      if (globalLoader) globalLoader.style.display = 'flex';
  };

  window.esconderLoader = function() {
      if (globalLoader) globalLoader.style.display = 'none';
  };
</script>
