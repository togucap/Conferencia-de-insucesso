<script>
  // ============================================================================
  // SCRIPT: EXPORTAÇÃO EXCEL (VEREDITO FINAL)
  // Responsabilidade: gerar o .xlsx a partir do motor de julgamento (Julgamento.gs),
  // o mesmo que alimenta o pop-up "Detalhes", o resumo da finalização e o romaneio.
  // ============================================================================

  function exportarRelatorioExcel() {
      if (!cargaAtual) return;

      if (typeof XLSX === 'undefined') {
          alert("Erro: A biblioteca de exportação não foi carregada corretamente. Verifique a sua ligação à internet.");
          return;
      }

      const btnOriginalText = btnExportarResumo ? btnExportarResumo.innerHTML : "";
      if (btnExportarResumo) btnExportarResumo.innerHTML = "⏳ A gerar Excel...";
      if (btnExportarMicro) btnExportarMicro.innerHTML = "⏳ Aguarde...";

      obterJulgamentoAtual(function(j) {
          const cabecalho = ["Situação do Pedido", "Tipo", "NF", "Pedido Faturado", "Mercadoria Codigo", "Produto Nome",
                             "Status da Conferencia", "Na Lista de Chegada", "Veredito Final", "Alertas"];
          const linhasConsolidado = [cabecalho];
          const linhasUnitarios = [cabecalho];
          const linhasMultiplos = [cabecalho];

          const alertasPorItem = {};
          j.alertas.forEach(a => {
              const chave = (a.pedido || '') + '|' + (a.etiqueta || '');
              (alertasPorItem[chave] = alertasPorItem[chave] || []).push(a.texto);
          });
          const rotuloPedido = {};
          j.pedidos.forEach(p => { rotuloPedido[p.situacao] = p.rotulo; });

          // Itens agrupados por pedido (múltiplos primeiro, como na tabela)
          const itens = j.itens.slice().sort((a, b) => {
              if (a.multiplo !== b.multiplo) return a.multiplo ? -1 : 1;
              return a.multiplo ? String(a.pedido).localeCompare(String(b.pedido)) : 0;
          });

          let ultimoPedidoMultiplo = "";
          itens.forEach(it => {
              const linha = [
                  rotuloPedido[it.situacaoPedido] || it.situacaoPedido,
                  it.multiplo ? `Múltiplo (${it.totalPedido})` : "Unitário",
                  it.nf || "N/A", it.pedido || "N/A", it.etiqueta, it.produto || "N/A",
                  it.status || "Aguardando bipagem",
                  it.naLista ? "Sim" : "Não",
                  it.veredito,
                  (alertasPorItem[(it.pedido || '') + '|' + it.etiqueta] || []).join(" | ")
              ];
              linhasConsolidado.push(linha);
              if (it.multiplo) {
                  if (ultimoPedidoMultiplo !== "" && it.pedido !== ultimoPedidoMultiplo) {
                      linhasMultiplos.push(new Array(cabecalho.length).fill(""));
                  }
                  linhasMultiplos.push(linha);
                  ultimoPedidoMultiplo = it.pedido;
              } else {
                  linhasUnitarios.push(linha);
              }
          });

          j.divergencias.forEach(d => {
              linhasConsolidado.push(["Fora da malha", "-", "N/A", "N/A", d.etiqueta, "N/A",
                  "Bipado fora da carga", "N/A", d.veredito,
                  d.outrasCargas.length ? "Encontrada na carga " + d.outrasCargas.join(", ") : ""]);
          });

          const wb = XLSX.utils.book_new();
          const wscols = [
              {wch: 24}, // Situação do Pedido
              {wch: 13}, // Tipo
              {wch: 13}, // NF
              {wch: 16}, // Pedido Faturado
              {wch: 18}, // Mercadoria Codigo
              {wch: 40}, // Produto Nome
              {wch: 22}, // Status
              {wch: 12}, // Lista de Chegada
              {wch: 36}, // Veredito
              {wch: 60}  // Alertas
          ];
          [["Consolidado", linhasConsolidado], ["Unitários", linhasUnitarios], ["Múltiplos", linhasMultiplos]].forEach(([nome, linhas]) => {
              const ws = XLSX.utils.aoa_to_sheet(linhas);
              ws['!cols'] = wscols;
              XLSX.utils.book_append_sheet(wb, ws, nome);
          });

          XLSX.writeFile(wb, `Relatorio_Operacao_${cargaAtual}_${new Date().getTime()}.xlsx`);

          if (btnExportarResumo) btnExportarResumo.innerHTML = btnOriginalText;
          if (btnExportarMicro) btnExportarMicro.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Exportar`;
      });
  }

  if (btnExportarMicro) {
      btnExportarMicro.addEventListener('click', exportarRelatorioExcel);
  }

  if (btnExportarResumo) {
      btnExportarResumo.addEventListener('click', exportarRelatorioExcel);
  }
</script>
