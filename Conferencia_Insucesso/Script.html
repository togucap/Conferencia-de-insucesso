<script>
  // ============================================================================
  // SCRIPT PRINCIPAL: MOTOR DE AUDITORIA (BIPAGEM INTELIGENTE INTER-CARGAS)
  // ============================================================================

  // --- APRESENTAÇÃO DOS RESULTADOS DA LEITURA (apenas HTML; a lógica fica abaixo) ---
  const esc = (typeof escaparHtml === 'function') ? escaparHtml : (t => String(t == null ? '' : t));
  const icone = (nome) => (window.ICONES_BIPE && window.ICONES_BIPE[nome]) || '';

  function cartaoBipe(opcoes) {
      // opcoes: { tipo, titulo, sub, aviso, etiqueta, produto, meta, tag, rodape }
      return `
        <div class="bipe-card bipe-${opcoes.tipo}"${opcoes.etiqueta ? ` data-etiqueta="${esc(opcoes.etiqueta)}"` : ''}>
          <div class="bipe-topo">
            <span class="bipe-icone">${opcoes.icone || ''}</span>
            <div class="bipe-cabecalho">
              <span class="bipe-titulo">${opcoes.titulo}</span>
              ${opcoes.sub ? `<span class="bipe-sub">${opcoes.sub}</span>` : ''}
            </div>
            ${opcoes.tag || ''}
          </div>
          ${opcoes.aviso || ''}
          ${opcoes.etiqueta ? `
          <div class="bipe-corpo">
            <span class="bipe-etiqueta">${esc(opcoes.etiqueta)}</span>
            ${opcoes.produto ? `<span class="bipe-produto">${esc(opcoes.produto)}</span>` : ''}
            ${opcoes.meta ? `<span class="bipe-meta">${opcoes.meta}</span>` : ''}
          </div>` : ''}
          ${opcoes.rodape || ''}
        </div>`;
  }

  function rodapePedido(titulo, conferidos, total) {
      let segmentos = '';
      for (let s = 0; s < total; s++) segmentos += `<span class="bipe-seg${s < conferidos ? ' cheio' : ''}"></span>`;
      return `
        <div class="bipe-rodape">
          <div class="bipe-rodape-linha">
            <span class="bipe-rodape-titulo">${titulo}</span>
            <span class="bipe-rodape-contagem">${conferidos} de ${total} itens</span>
          </div>
          <div class="bipe-segmentos">${segmentos}</div>
        </div>`;
  }

  function horaCurta() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function registrarLeitura(codigo, tipo, produto) {
      if (typeof registrarLeituraVisual === 'function') registrarLeituraVisual(codigo, tipo, produto);
  }

  // Gravações do bipe: o servidor recusa se a carga foi finalizada (neste ou noutro PC) ou se a
  // linha é uma divergência. Nesse caso avisa e recarrega a carga para o ecrã bater com a planilha.
  function gravarBipeNoServidor(nomeFuncao, linha, dataHora, codigo) {
    const carga = cargaAtual;
    google.script.run
      .withSuccessHandler(function(r) { tratarRecusaGravacao(r, carga); })
      .withFailureHandler(function(erro) {
          if (statusMensagem) statusMensagem.innerText = `Falha ao gravar o bipe ${codigo}: ${erro.message}`;
      })[nomeFuncao](carga, linha, dataHora);
  }

  function tratarRecusaGravacao(r, carga) {
    if (!r || !r.recusado || carga !== cargaAtual) return;
    if (modalAlertaEtiqueta && textoAlertaEtiqueta) {
        textoAlertaEtiqueta.innerHTML = `<strong>Bipe não gravado</strong><br><br>${esc(r.mensagem || '')}`;
        modalAlertaEtiqueta.style.display = 'flex';
    }
    if (r.recusado === 'CARGA_FINALIZADA') {
        if (typeof definirEstadoCargaAtual === 'function') definirEstadoCargaAtual(true);
        if (typeof atualizarListaCargas === 'function') atualizarListaCargas();
    }
    if (btnCarregar && selectAbas && selectAbas.value === carga) btnCarregar.click();
  }
  window.tratarRecusaGravacao = tratarRecusaGravacao;

  if (inputEtiqueta) {
      inputEtiqueta.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          const codigoBipado = inputEtiqueta.value.trim();

          // Carga finalizada (somente leitura) ou resumo aberto: nenhum bipe é processado
          const resumoAberto = modalResumoFinal && modalResumoFinal.style.display !== 'none';
          if (codigoBipado !== "" && (resumoAberto || (selectAbas && selectAbas.dataset.finalizada === 'true'))) {
            if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                tipo: 'invalido', icone: icone('alerta'),
                titulo: 'Carga finalizada', sub: 'Somente leitura: o bipe não foi gravado. Reabra a conferência no resumo para continuar.',
                etiqueta: codigoBipado
            });
            inputEtiqueta.value = "";
            return;
          }

          if (codigoBipado !== "") {
            if (!/^\d{8}$/.test(codigoBipado)) {
              if (modalAlertaEtiqueta && textoAlertaEtiqueta) {
                  textoAlertaEtiqueta.innerHTML = `A etiqueta <strong>"${esc(codigoBipado)}"</strong> está fora do padrão de 8 dígitos.<br>Por favor, verifique e tente novamente.`;
                  modalAlertaEtiqueta.style.display = 'flex';
              }
              if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                  tipo: 'invalido', icone: icone('alerta'),
                  titulo: 'Código inválido', sub: 'A etiqueta deve ter exatamente 8 dígitos.',
                  etiqueta: codigoBipado
              });
              registrarLeitura(codigoBipado, 'invalido');
              inputEtiqueta.value = "";
              return;
            }

            if (indiceColunaMercadoria === -1) {
              if (modalAlertaEtiqueta && textoAlertaEtiqueta) {
                  textoAlertaEtiqueta.innerHTML = "FALHA NA ESTRUTURA:<br>A coluna <strong>'Mercadoria Código'</strong> está ausente na base de dados.";
                  modalAlertaEtiqueta.style.display = 'flex';
              }
              inputEtiqueta.value = "";
              return;
            }

            // ========================================================================
            // NOVA TRAVA: VERIFICAÇÃO SILENCIOSA DE DIVERGÊNCIAS (REINCIDÊNCIA)
            // Impede que um item já classificado como "Fora da Carga" mude para "Conferido"
            // ao ser lido uma 2ª, 3ª vez etc. Mantém o ecrã fluído.
            // ========================================================================
            if (divergenciasBipadas.has(codigoBipado)) {
                if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                    tipo: 'divergencia', icone: icone('repetido'),
                    titulo: 'Divergência já registada', sub: 'Esta etiqueta já foi bipada e consta como fora da carga.',
                    etiqueta: codigoBipado
                });
                registrarLeitura(codigoBipado, 'divergencia-repetida');
                inputEtiqueta.value = "";
                return; // Aborta antes de iterar pelas linhas da tabela
            }

            const historicoItem = typeof mapaHistoricoGlobal !== 'undefined' ? mapaHistoricoGlobal[codigoBipado] : null;
            let msgAlertaHistorico = "";
            let isReincidenteBloqueado = false;

            if (historicoItem) {
                if (historicoItem.ultimoStatus === "Bloqueado") {
                    isReincidenteBloqueado = true;
                    msgAlertaHistorico = `
                        <div class="bipe-aviso bipe-aviso-perigo">
                            ${icone('relogio')}
                            <span>Item reincidente: bloqueado (Não Receber) na carga ${esc(historicoItem.ultimaCarga)}.</span>
                        </div>`;
                } else if (historicoItem.ultimoStatus === "Recusado Manualmente") {
                    msgAlertaHistorico = `
                        <div class="bipe-aviso bipe-aviso-perigo">
                            ${icone('relogio')}
                            <span>Atenção: este item foi recusado manualmente na carga ${esc(historicoItem.ultimaCarga)}.</span>
                        </div>`;
                } else if (historicoItem.ultimoStatus === "Falta Confirmada") {
                    msgAlertaHistorico = `
                        <div class="bipe-aviso bipe-aviso-info">
                            ${icone('relogio')}
                            <span>Falta recuperada: este item estava pendente na carga ${esc(historicoItem.ultimaCarga)}.</span>
                        </div>`;
                }
            }

            let encontrouNaoConferido = false;
            let encontrouJaConferido = false;
            let linhaPlanilhaIndex = -1;
            let celulasAlvo = null;

            // Modo recusa: o volume bipado fica como "Recusado Manualmente" (status cru, sem motivo)
            const modoRecusa = typeof modoRecusaAtivo === 'function' && modoRecusaAtivo();
            const STATUS_RECUSA = "Recusado Manualmente";
            let linhaConvertivel = null;   // já conferida (OK) e que pode passar a recusa
            let jaRecusadoManual = false;

            if (!tabelaCorpo) return;
            const linhasTabela = tabelaCorpo.querySelectorAll('tr');

            // Pedido da linha e alerta "consta na Lista de Chegada" (não deveria acontecer em bloqueados/recusados)
            const pedidoDaLinha = cels => (indicePedidoFaturado !== -1 && cels[indicePedidoFaturado])
                ? cels[indicePedidoFaturado].textContent.replace('MSPC', '').trim() : "";
            const avisoListaChegada = (cels, texto) => {
                const chave = pedidoDaLinha(cels) + "|" + codigoBipado;
                if (!setListaChegadaCarga || !setListaChegadaCarga.has(chave)) return "";
                return `
                    <div class="bipe-aviso bipe-aviso-perigo">
                        ${icone('alerta')}
                        <span>${texto}</span>
                    </div>`;
            };

            for (let i = 0; i < linhasTabela.length; i++) {
              // A linha de uma divergência (fora da carga) nunca é conferida
              if (linhasTabela[i].classList.contains('linha-divergencia')) continue;
              const celulas = linhasTabela[i].querySelectorAll('td');

              if (celulas[indiceColunaMercadoria] && celulas[indiceColunaMercadoria].textContent.trim() === codigoBipado) {

                let isAvaliacaoLocalBloqueada = false;
                if (indiceColunaAvaliacao !== -1) {
                  const aval = celulas[indiceColunaAvaliacao].textContent.trim().toLowerCase();
                  if (aval === 'não receber' || aval === 'nao receber') isAvaliacaoLocalBloqueada = true;
                }

                // O bloqueio é feito por NF/pedido: vale para todas as etiquetas do mesmo pedido
                const pedLinha = pedidoDaLinha(celulas);
                const isPedidoBloqueado = pedLinha !== "" && pedidosBloqueados.has(pedLinha);

                if (isAvaliacaoLocalBloqueada || isReincidenteBloqueado || isPedidoBloqueado) {
                    const nomeProibido = indiceColunaProduto !== -1 ? celulas[indiceColunaProduto].textContent : "";

                    recusasInterceptadas.add(codigoBipado);
                    if (pedLinha) pedidosBloqueados.add(pedLinha);
                    linhasTabela[i].classList.add('linha-bloqueio-bipado', 'linha-pedido-bloqueado');
                    const dataHora = new Date().toLocaleString('pt-BR');
                    linhaPlanilhaIndex = linhasTabela[i].dataset.linhaOriginal;
                    const avisoBloqLista = avisoListaChegada(celulas,
                        'Este pedido está bloqueado e já consta na Lista de Chegada. Falha de processo: notifique.');

                    if (indiceStatus !== -1 && celulas[indiceStatus]) celulas[indiceStatus].textContent = "Bloqueado";
                    if (isReincidenteBloqueado && indiceColunaAvaliacao !== -1 && celulas[indiceColunaAvaliacao]) {
                        celulas[indiceColunaAvaliacao].textContent = "Não Receber";
                    }

                    gravarBipeNoServidor('registrarBloqueio', linhaPlanilhaIndex, dataHora, codigoBipado);

                    // Mostra o número E o nome do produto barrado juntos no mesmo cartão
                    if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                        tipo: 'bloqueio', icone: icone('bloqueio'),
                        titulo: 'NÃO RECEBER', sub: isPedidoBloqueado && !isAvaliacaoLocalBloqueada
                            ? 'Outro volume deste pedido está bloqueado: o pedido inteiro é recusado. Separe o volume.'
                            : 'Produto bloqueado pela auditoria. Separe o volume.',
                        aviso: avisoBloqLista + msgAlertaHistorico,
                        etiqueta: codigoBipado, produto: nomeProibido
                    });
                    registrarLeitura(codigoBipado, 'bloqueio', nomeProibido);
                    atualizarProgresso();
                    inputEtiqueta.value = "";
                    return;
                }

                if (!linhasTabela[i].classList.contains('linha-conferida')) {
                  linhasTabela[i].classList.add('linha-conferida');
                  if (modoRecusa) {
                    linhasTabela[i].classList.add('linha-recusada-manual');
                    if (indiceStatus !== -1 && celulas[indiceStatus]) celulas[indiceStatus].textContent = STATUS_RECUSA;
                  }
                  encontrouNaoConferido = true;
                  linhaPlanilhaIndex = linhasTabela[i].dataset.linhaOriginal;
                  celulasAlvo = celulas;

                  itensConferidosCarga++;
                  atualizarProgresso();
                  break;
                } else {
                  encontrouJaConferido = true;
                  if (linhasTabela[i].classList.contains('linha-recusada-manual')) {
                    jaRecusadoManual = true;
                  } else if (!linhaConvertivel) {
                    linhaConvertivel = { tr: linhasTabela[i], celulas: celulas };
                  }
                }
              }
            }

            const dataHora = new Date().toLocaleString('pt-BR');

            if (encontrouNaoConferido) {
              let nomeProd = "";
              if (indiceColunaProduto !== -1 && celulasAlvo && celulasAlvo[indiceColunaProduto]) {
                  nomeProd = celulasAlvo[indiceColunaProduto].textContent.trim();
              }

              let mspcVal = "";
              if (indiceMspc !== -1 && celulasAlvo && celulasAlvo[indiceMspc]) {
                  mspcVal = celulasAlvo[indiceMspc].textContent.trim();
              }

              let pedAlvo = "";
              let rodape = "";
              if (indicePedidoFaturado !== -1 && celulasAlvo && celulasAlvo[indicePedidoFaturado]) {
                  pedAlvo = celulasAlvo[indicePedidoFaturado].textContent.replace('MSPC', '').trim();
                  const totalDestePedido = mapaPedidosTotal[pedAlvo] || 1;
                  mapaPedidosConferidos[pedAlvo] = (mapaPedidosConferidos[pedAlvo] || 0) + 1;

                  if (totalDestePedido > 1) {
                      const faltam = totalDestePedido - mapaPedidosConferidos[pedAlvo];
                      const conferidosDoPedido = Math.min(mapaPedidosConferidos[pedAlvo], totalDestePedido);
                      if (faltam > 0) {
                          rodape = rodapePedido(`Pedido parcial: faltam ${faltam} item(s)`, conferidosDoPedido, totalDestePedido);
                      } else {
                          rodape = rodapePedido('Pedido múltiplo completo', conferidosDoPedido, totalDestePedido);
                      }
                  }
              }

              let meta = [];
              if (pedAlvo) meta.push(`Pedido ${esc(pedAlvo)}`);
              if (typeof indiceNF !== 'undefined' && indiceNF !== -1 && celulasAlvo && celulasAlvo[indiceNF] && celulasAlvo[indiceNF].textContent.trim()) {
                  meta.push(`NF ${esc(celulasAlvo[indiceNF].textContent.trim())}`);
              }

              if (indiceDataHora !== -1 && celulasAlvo && celulasAlvo[indiceDataHora]) celulasAlvo[indiceDataHora].textContent = dataHora;

              if (modoRecusa) {
                  if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                      tipo: 'recusa', icone: icone('bloqueio'),
                      titulo: 'RECUSADO MANUALMENTE', sub: `Recusa registada às ${horaCurta()}. Separe o volume.`,
                      tag: mspcVal !== "" ? '<span class="tag-mspc">Item MSPC</span>' : '',
                      aviso: (celulasAlvo ? avisoListaChegada(celulasAlvo, 'Este volume consta na Lista de Chegada e foi recusado. Verifique.') : '') + msgAlertaHistorico,
                      etiqueta: codigoBipado, produto: nomeProd, meta: meta.join(' · '),
                      rodape: rodape
                  });
                  registrarLeitura(codigoBipado, 'recusa-manual', nomeProd);
                  gravarBipeNoServidor('registrarRecusaManual', linhaPlanilhaIndex, dataHora, codigoBipado);
              } else {
                  if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                      tipo: 'ok', icone: icone('ok'),
                      titulo: 'Conferido', sub: `Lido e auditado às ${horaCurta()}`,
                      tag: mspcVal !== "" ? '<span class="tag-mspc">Item MSPC</span>' : '',
                      aviso: msgAlertaHistorico,
                      etiqueta: codigoBipado, produto: nomeProd, meta: meta.join(' · '),
                      rodape: rodape
                  });
                  registrarLeitura(codigoBipado, 'ok', nomeProd);
                  gravarBipeNoServidor('registrarConferencia', linhaPlanilhaIndex, dataHora, codigoBipado);
              }

              if (typeof atualizarDashboardGerencial === 'function') atualizarDashboardGerencial();

            } else if (encontrouJaConferido && modoRecusa && linhaConvertivel) {
              // Já estava conferido (OK) e o operador bipou de novo em modo recusa: passa a recusa manual
              const alvo = linhaConvertivel;
              alvo.tr.classList.add('linha-recusada-manual');
              if (indiceStatus !== -1 && alvo.celulas[indiceStatus]) alvo.celulas[indiceStatus].textContent = STATUS_RECUSA;
              if (indiceDataHora !== -1 && alvo.celulas[indiceDataHora]) alvo.celulas[indiceDataHora].textContent = dataHora;
              const nomeConv = (indiceColunaProduto !== -1 && alvo.celulas[indiceColunaProduto]) ? alvo.celulas[indiceColunaProduto].textContent.trim() : "";
              if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                  tipo: 'recusa', icone: icone('repetido'),
                  titulo: 'ALTERADO PARA RECUSA', sub: 'Este volume já estava conferido e passou a Recusado Manualmente.',
                  aviso: avisoListaChegada(alvo.celulas, 'Este volume consta na Lista de Chegada e foi recusado. Verifique.') + msgAlertaHistorico,
                  etiqueta: codigoBipado, produto: nomeConv
              });
              registrarLeitura(codigoBipado, 'recusa-convertida', nomeConv);
              gravarBipeNoServidor('registrarRecusaManual', alvo.tr.dataset.linhaOriginal, dataHora, codigoBipado);
              atualizarProgresso();
            } else if (encontrouJaConferido && jaRecusadoManual && !linhaConvertivel) {
              if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                  tipo: 'repetido', icone: icone('repetido'),
                  titulo: 'Já recusado manualmente', sub: 'Este volume já foi bipado em modo recusa.',
                  etiqueta: codigoBipado
              });
              registrarLeitura(codigoBipado, 'repetido');
            } else if (encontrouJaConferido) {
              if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                  tipo: 'repetido', icone: icone('repetido'),
                  titulo: 'Já conferido', sub: 'Volumetria esgotada: todas as linhas desta etiqueta já foram bipadas.',
                  etiqueta: codigoBipado
              });
              registrarLeitura(codigoBipado, 'repetido');
            } else {
              const subDivergencia = isReincidenteBloqueado
                  ? 'Rejeição definitiva: o item não consta na malha e já tem histórico de bloqueio.'
                  : 'Código ausente na malha atual. Registado como fora da malha; a procurar noutras cargas…';
              if (resultadoBipe) resultadoBipe.innerHTML = cartaoBipe({
                  tipo: 'divergencia', icone: icone('alerta'),
                  titulo: 'Fora da malha', sub: subDivergencia,
                  aviso: msgAlertaHistorico,
                  etiqueta: codigoBipado
              });
              registrarLeitura(codigoBipado, 'divergencia');

              if (containerNaoEncontrados) containerNaoEncontrados.style.display = 'block';
              const li = document.createElement('li');
              const hora = new Date().toLocaleTimeString('pt-BR');
              li.dataset.etiqueta = codigoBipado;
              li.innerHTML = `<strong>${esc(codigoBipado)}</strong> - Bipado às ${hora}`;
              if (listaNaoEncontrados) listaNaoEncontrados.prepend(li);

              divergenciasBipadas.add(codigoBipado);

              // ATUALIZAR CONTADOR (BADGE)
              const badgeErros = document.getElementById('badgeErros');
              if (badgeErros) {
                  badgeErros.innerText = divergenciasBipadas.size;
                  badgeErros.style.display = 'inline-block';
              }

              // O servidor grava a divergência e procura a etiqueta nas outras cargas. Se ela pertence
              // a outra carga, o motor de prazo (Tracking.gs) corre em segundo plano a seguir.
              const cargaDoBipe = cargaAtual;
              google.script.run
                  .withSuccessHandler(function(r) {
                      if (r && r.recusado) { tratarRecusaGravacao(r, cargaDoBipe); return; }
                      if (cargaDoBipe !== cargaAtual) return;
                      if (r && r.outrasCargas && r.outrasCargas.length) {
                          if (typeof registarOutrasCargas === 'function') registarOutrasCargas(r.etiqueta, r.outrasCargas);
                          if (typeof agendarVerificacaoPrazo === 'function') agendarVerificacaoPrazo([r.etiqueta]);
                      }
                  })
                  .registrarErroNaMesmaAba(cargaDoBipe, codigoBipado, dataHora);
            }

            inputEtiqueta.value = "";
          }
        }
      });
  }
</script>
