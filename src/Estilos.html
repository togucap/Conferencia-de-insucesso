<style>
  /* --- VARIÁVEIS DE TEMA ESCURO (K-OUT DARK MODE) --- */
  :root, [data-theme="dark"] {
    --bg-global: #0f172a;       /* Slate 900 - Azul Escuro Profundo */
    --bg-card: #1e293b;         /* Slate 800 - Elevated */
    --border-color: #334155;    /* Slate 700 - Linhas sutis */
    --text-main: #f8fafc;       /* Slate 50 - Branco puro/suave */
    --text-support: #94a3b8;    /* Slate 400 - Apoio */
    
    --brand-accent: #f97316;    /* Orange 500 */
    --brand-hover: #ea580c;     /* Orange 600 */
    
    --table-hover: #0f172a;     /* Hover super sutil na tabela */
    
    /* Indicadores Base */
    --emerald: #10b981;
    --red-alert: #ef4444;
    --red-action: #b91c1c;
    
    --scrollbar-bg: #0f172a;
    --scrollbar-thumb: #334155;
  }

  /* --- VARIÁVEIS DE TEMA CLARO (K-OUT LIGHT MODE) --- */
  [data-theme="light"] {
    --bg-global: #f8fafc;       /* Off-white acinzentado */
    --bg-card: #ffffff;         /* Branco puro */
    --border-color: #e2e8f0;    /* Cinza claro */
    --text-main: #0f172a;       /* Slate escuro */
    --text-support: #64748b;    /* Cinza médio */
    
    --brand-accent: #f97316;
    --brand-hover: #ea580c;
    
    --table-hover: #f1f5f9;
    
    --emerald: #059669;
    --red-alert: #ef4444;
    --red-action: #991b1b;
    
    --scrollbar-bg: #f8fafc;
    --scrollbar-thumb: #cbd5e1;
  }

  /* --- GERAL --- */
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg-global);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background-color 0.3s, color 0.3s;
  }

  /* --- SCROLLBAR MINIMALISTA --- */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--brand-accent); }

  /* --- SIDEBAR K-OUT --- */
  .sidebar {
    width: 260px;
    background-color: var(--bg-global);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    z-index: 10;
    padding: 24px 16px;
    transition: background-color 0.3s, border-color 0.3s;
  }

  .sidebar-header { margin-bottom: 40px; padding: 0 10px; }
  
  .brand-logo {
    margin: 0;
    font-size: 22px; 
    font-weight: 900; 
    letter-spacing: -1px;
    color: var(--text-main);
    background: -webkit-linear-gradient(45deg, var(--brand-accent), #fb923c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
  
  .nav-item {
    padding: 12px 16px;
    border-radius: 12px; 
    color: var(--text-support);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  
  .nav-item:hover { background-color: var(--bg-card); color: var(--text-main); }
  
  .nav-item.active {
    background-color: var(--bg-card);
    color: var(--brand-accent);
    box-shadow: inset 3px 0 0 0 var(--brand-accent);
  }

  /* --- MAIN CONTENT & HEADER --- */
  .main-content {
    flex-grow: 1;
    padding: 32px 40px;
    overflow-y: auto;
    display: block; 
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px; 
  }

  .header-titles h2 { margin: 0 0 4px 0; font-size: 24px; font-weight: 700; }
  .header-titles p { margin: 0; font-size: 14px; color: var(--text-support); }
  
  .text-support { color: var(--text-support); font-size: 13px; font-weight: 500; }

  /* --- CONTROLES HORIZONTAIS --- */
  .controls-bar {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    background-color: var(--bg-card);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    margin-bottom: 24px; 
  }

  .input-group { display: flex; flex-direction: column; flex-grow: 1; }
  
  label { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-support); text-transform: uppercase; letter-spacing: 0.5px;}

  /* --- SELECT PERSONALIZADO E INPUTS GENÉRICOS --- */
  select, input[type="text"], input[type="date"] {
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-global);
    color: var(--text-main);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  select {
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%23f97316" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
    background-repeat: no-repeat;
    background-position: right 16px center;
    padding-right: 48px;
  }

  select:focus, input[type="text"]:focus, input[type="date"]:focus {
    border-color: var(--brand-accent);
    box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
    background-color: var(--bg-card);
  }
  
  select option {
    background-color: var(--bg-card);
    color: var(--text-main);
    font-size: 15px;
    padding: 14px;
    font-weight: 500;
  }
  
  select option:checked {
    background-color: var(--brand-accent) !important;
    color: #ffffff !important;
    font-weight: bold;
  }

  .btn-brand {
    background-color: var(--brand-accent);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
    height: 45px;
  }

  .btn-brand:hover:not(:disabled) { background-color: var(--brand-hover); }
  .btn-brand:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- DROPDOWN CUSTOMIZADO DE SELEÇÃO DE CARGAS (NOVO) --- */
  .custom-carga-dropdown { position: relative; width: 100%; min-width: 280px; font-family: inherit; }
  
  .carga-dropdown-btn {
      width: 100%;
      background-color: var(--bg-global);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 40px 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      transition: all 0.2s ease;
      position: relative;
  }
  
  .carga-dropdown-btn:hover { border-color: var(--brand-accent); }
  
  .carga-dropdown-btn::after {
      content: ""; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 5px solid var(--text-support);
      transition: transform 0.2s ease;
  }
  
  .custom-carga-dropdown.active .carga-dropdown-btn::after { 
      transform: translateY(-50%) rotate(180deg); 
      border-top-color: var(--brand-accent); 
  }
  
  .custom-carga-dropdown.active .carga-dropdown-btn { 
      border-color: var(--brand-accent); 
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15); 
  }
  
  .carga-dropdown-content {
      position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
      background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); z-index: 100; display: none;
      max-height: 380px; overflow-y: auto;
      animation: fadeInDown 0.2s ease-out;
  }
  
  .carga-group-header {
      padding: 12px 16px; font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-support); background-color: var(--bg-global);
      border-bottom: 1px solid var(--border-color); border-top: 1px solid var(--border-color);
      display: flex; align-items: center; gap: 8px;
  }
  
  .carga-group-header:first-child { border-top: none; border-top-left-radius: 10px; border-top-right-radius: 10px; }
  
  .carga-item {
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: background-color 0.2s, padding-left 0.2s; border-bottom: 1px solid var(--border-color);
  }
  
  .carga-item:last-child { border-bottom: none; }
  .carga-item:hover { background-color: rgba(0,0,0,0.03); }
  [data-theme="dark"] .carga-item:hover { background-color: rgba(255,255,255,0.03); }
  
  .carga-item.aberta:hover { border-left: 3px solid var(--brand-accent); padding-left: 13px; }
  .carga-item.concluida:hover { border-left: 3px solid var(--emerald); padding-left: 13px; }
  
  .carga-item-title { font-weight: 600; font-size: 14px; color: var(--text-main); }
  .carga-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
  .badge-aberta { background-color: rgba(249, 115, 22, 0.15); color: var(--brand-accent); }
  .badge-concluida { background-color: rgba(16, 185, 129, 0.15); color: var(--emerald); }

  /* --- ESTRUTURA DOS FILTROS DROPDOWN (PREMIUM) --- */
  .custom-dropdown { position: relative; font-family: inherit; }
  
  .dropdown-btn {
      background-color: var(--bg-global);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 36px 10px 16px; /* Espaço para a seta */
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      min-width: 160px;
      text-align: left;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  
  .dropdown-btn:hover {
      border-color: var(--brand-accent);
      background-color: var(--bg-card);
  }
  
  /* Seta animada */
  .dropdown-btn::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 5px solid var(--text-support);
      transition: transform 0.2s ease, border-top-color 0.2s;
  }
  
  .custom-dropdown.active .dropdown-btn::after {
      transform: translateY(-50%) rotate(180deg);
      border-top-color: var(--brand-accent);
  }
  
  .custom-dropdown.active .dropdown-btn {
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
      background-color: var(--bg-card);
  }

  .dropdown-content {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.1);
      z-index: 100;
      width: 260px;
      display: none; 
      animation: fadeInDown 0.2s ease-out;
  }
  
  @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-search-container { padding: 12px; border-bottom: 1px solid var(--border-color); }
  .dropdown-search {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      background-color: var(--bg-global); border: 1px solid var(--border-color);
      color: var(--text-main); border-radius: 6px; font-size: 13px;
      transition: border-color 0.2s;
  }
  .dropdown-search:focus { border-color: var(--brand-accent); outline: none; }

  .dropdown-actions {
      display: flex; justify-content: space-between; padding: 10px 12px;
      border-bottom: 1px solid var(--border-color); background-color: rgba(0,0,0,0.02);
  }
  .dropdown-actions button {
      background: none; border: none; color: var(--text-support); cursor: pointer;
      font-size: 12px; font-weight: 600; transition: color 0.2s;
  }
  .dropdown-actions button:hover { color: var(--brand-accent); }
  
  .dropdown-list { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; }
  .dropdown-list li {
      padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); transition: background-color 0.2s;
  }
  .dropdown-list li:last-child { border-bottom: none; }
  .dropdown-list li:hover { background-color: rgba(249, 115, 22, 0.05); }
  
  .dropdown-list label { 
      display: flex; align-items: center; gap: 10px; cursor: pointer; 
      width: 100%; color: var(--text-main); font-size: 14px; font-weight: 500;
      margin-bottom: 0; text-transform: none; letter-spacing: normal;
  }
  
  .dropdown-list label input[type="checkbox"] {
      accent-color: var(--brand-accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
  }
  
  .btn-only {
      display: none; background: rgba(249, 115, 22, 0.1); border: none; color: var(--brand-accent);
      cursor: pointer; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px;
      transition: background 0.2s, color 0.2s;
  }
  .btn-only:hover { background: var(--brand-accent); color: white; }
  .dropdown-list li:hover .btn-only { display: block; }

  /* --- BOTÃO LIMPAR FILTROS GLOBAIS --- */
  .btn-clear-all {
      background-color: transparent;
      border: 1px dashed var(--text-support);
      color: var(--text-support);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto; /* Empurra para o extremo direito */
  }
  .btn-clear-all:hover {
      color: var(--red-alert);
      border-color: var(--red-alert);
      background-color: rgba(239, 68, 68, 0.05);
  }

  /* --- GRID DE KPIs ORIGINAL --- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 24px; 
  }

  .kpi-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* REALCE DOS TÍTULOS GLOBAIS DOS CARTÕES */
  .kpi-title {
    font-size: 14px; /* Aumentado de 12px para 14px */
    color: var(--text-main); /* Mudado para branco/texto principal */
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 800; /* Extra Bold */
    margin-bottom: 12px;
  }

  .kpi-value {
    font-size: 36px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1;
    margin-bottom: 12px;
  }

  .kpi-sub { font-size: 13px; font-weight: 600; }
  .kpi-emerald { color: var(--emerald); }
  .kpi-alert { color: var(--red-alert); }
  .kpi-action { color: var(--red-action); }

  /* --- NOVA VISÃO: KPI SPLIT (METADE/METADE) --- */
  .kpi-card-split {
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .kpi-split-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
  }
  .kpi-split-body {
    display: flex;
    width: 100%;
  }
  .kpi-split-left, .kpi-split-right {
    flex: 1;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .kpi-split-left {
    border-right: 1px solid var(--border-color);
  }
  .kpi-split-right {
    background-color: rgba(0,0,0,0.02);
  }
  [data-theme="dark"] .kpi-split-right {
    background-color: rgba(255,255,255,0.02);
  }
  
  /* REALCE DOS SUBTÍTULOS DOS CARTÕES DIVIDIDOS */
  .kpi-split-label {
    font-size: 12px; /* Aumentado de 11px para 12px */
    font-weight: 800; /* Extra Bold */
    text-transform: uppercase;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  
  .kpi-split-val-total {
    font-size: 28px;
    font-weight: 800; /* Mais forte */
    color: var(--text-main); /* Branco em vez de Cinza Opaco */
    line-height: 1.2;
  }
  .kpi-split-val-realizado {
    font-size: 28px;
    font-weight: 900; /* Extra Forte */
    color: var(--brand-accent);
    line-height: 1.2;
    text-shadow: 0 0 15px rgba(249, 115, 22, 0.4); /* Efeito de brilho */
  }

  /* --- BARRA DE PROGRESSO --- */
  .progress-container {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px; 
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .progress-text {
    font-weight: 700;
    color: var(--text-main);
    font-size: 14px;
  }

  .progress-bar-bg {
    background-color: var(--bg-global);
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background-color: var(--brand-accent);
    width: 0%;
    transition: width 0.4s ease, background-color 0.4s ease;
  }

  /* --- FILTRO DA TABELA --- */
  .table-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .filtro-select {
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-global);
    color: var(--text-main);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .filtro-select:focus { border-color: var(--brand-accent); }

  /* --- CONTAINERS GERAIS (Bipar/Erros) --- */
  .card-container {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px; 
  }

  .card-title { margin: 0 0 10px 0; font-size: 18px; color: var(--text-main); }
  .input-large { font-size: 20px !important; padding: 16px !important; }
  .status-bipe { margin-top: 16px; font-weight: 600; font-size: 15px; }

  /* --- TABELA MINIMALISTA --- */
  .table-container {
    width: 100%;
    overflow-x: auto;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    margin-bottom: 60px; 
  }

  table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }

  th, td { 
    padding: 14px 20px; 
    border-bottom: 1px solid var(--border-color); 
    font-size: 14px; 
  }

  th {
    background-color: var(--bg-global);
    color: var(--text-support);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 12px;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  tbody tr { transition: background-color 0.2s; }
  tbody tr:hover { background-color: var(--table-hover); }

  /* COMPORTAMENTO "CONFERIDO" MINIMALISTA CORPORATIVO */
  .linha-conferida { background-color: transparent !important; }
  .linha-conferida td:first-child { box-shadow: inset 4px 0 0 0 var(--emerald); }
  .linha-conferida td { 
    color: var(--text-support); 
    opacity: 0.45; 
    text-decoration: line-through; 
  }

  /* --- AGRUPAMENTO DE MÚLTIPLOS (GRADIENTES ALTERNADOS) --- */
  .linha-multiplo-grupo-1 { background-image: linear-gradient(90deg, rgba(249, 115, 22, 0.20) 0%, rgba(249, 115, 22, 0.03) 50%, transparent 100%); }
  .linha-multiplo-grupo-2 { background-image: linear-gradient(90deg, rgba(58, 138, 119, 0.20) 0%, rgba(58, 138, 119, 0.03) 50%, transparent 100%); }

  /* --- SWITCHES (Toggle) --- */
  .theme-switch-wrapper { display: flex; align-items: center; gap: 12px; }
  .view-switch-container { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--border-color); transition: .3s; border-radius: 24px;
  }
  .slider:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px;
    background-color: var(--text-main); transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--brand-accent); }
  input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

  /* --- MENSAGENS E LISTAS DE ERRO --- */
  .status-msg { color: var(--brand-accent); font-weight: 600; font-size: 14px; }
  .erro-container { border-left: 4px solid var(--red-alert); }
  #listaNaoEncontrados { list-style-type: none; padding: 0; margin: 15px 0 0 0; }
  #listaNaoEncontrados li { color: var(--text-support); padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
  #listaNaoEncontrados li strong { color: var(--red-alert); }
